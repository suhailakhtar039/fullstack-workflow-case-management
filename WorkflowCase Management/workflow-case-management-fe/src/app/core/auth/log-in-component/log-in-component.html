<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-2xl font-semibold text-center mb-6">Sign in to CaseFlow</h2>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Username</mat-label>
        <input matInput name="username" required [(ngModel)]="username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full mb-6">
        <mat-label>Password</mat-label>
        <input matInput type="password" name="password" required [(ngModel)]="password" />
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        class="w-full"
        [disabled]="isLoading || loginForm.invalid"
      >
        {{ isLoading ? 'Signing in…' : 'Sign In' }}
      </button>

      <div *ngIf="errorMessage" class="mt-4 text-center text-red-600 text-sm">
        {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
