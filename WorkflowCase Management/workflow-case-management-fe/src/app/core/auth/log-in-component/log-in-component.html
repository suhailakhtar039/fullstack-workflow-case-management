<div class="p-6 max-w-sm mx-auto">
  <h2 class="text-xl mb-4">Login</h2>

  <input class="border p-2 w-full mb-3" placeholder="Username" [(ngModel)]="username" />

  <input
    class="border p-2 w-full mb-3"
    type="password"
    placeholder="Password"
    [(ngModel)]="password"
  />

  <button class="bg-blue-600 text-white px-4 py-2" (click)="login()">Login</button>
</div>
