<div class="p-6">
  <!-- page title -->
  <h1 class="text-2xl font-semibold mb-4">Cases</h1>

  <!-- Search bar -->
  <div class="flex gap-4 mb-6">
    <mat-form-field appearance="outline" class="w-72">
      <mat-label>Search</mat-label>
      <input
        matInput
        placeholder="Case number or title"
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
      />
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="onSearch()">Search</button>

    <mat-form-field appearance="outline" class="w-56">
      <mat-label>Status</mat-label>
      <mat-select [(ngModel)]="selectedStatus">
        <mat-option value="">All</mat-option>
        <mat-option *ngFor="let s of caseStatuses" [value]="s">
          {{ s }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-stroked-button (click)="onReset()">Reset</button>
  </div>

  <!-- Table starts here -->
  <div *ngIf="isLoading" class="flex justify-center py-10">
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  </div>

  <div
    *ngIf="!isLoading && !hasError && cases.length === 0"
    class="text-center text-gray-500 py-10"
  >
    No cases found.
  </div>

  <div *ngIf="hasError" class="mb-4 p-3 rounded bg-red-100 text-red-700">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !hasError && cases.length > 0" class="mat-elevation-z2">
    <mat-button-toggle-group [(ngModel)]="showMyCases" exclusive>
      <mat-button-toggle [value]="false">All Cases</mat-button-toggle>
      <mat-button-toggle [value]="true">My Cases</mat-button-toggle>
    </mat-button-toggle-group>

    <table mat-table [dataSource]="cases" class="w-full">
      <!-- Case number -->
      <ng-container matColumnDef="caseNumber">
        <th mat-header-cell *matHeaderCellDef>Case No</th>
        <td mat-cell *matCellDef="let row">{{ row.caseNumber }}</td>
      </ng-container>
      <!-- Title -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let row">{{ row.title }}</td>
      </ng-container>
      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let row">{{ row.status }}</td>
      </ng-container>
      <!-- Header and rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <!-- Paginator -->
    <mat-paginator
      [length]="totalElements"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </div>
</div>
