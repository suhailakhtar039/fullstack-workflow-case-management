<div class="p-6">
  <!-- page title -->
  <h1 class="text-2xl font-semibold mb-4">Cases</h1>

  <!-- Search bar -->
  <div class="flex gap-4 mb-6">
    <mat-form-field appearance="outline" class="w-72">
      <mat-label>Search</mat-label>
      <input matInput placeholder="Case number or title" />
    </mat-form-field>

    <button mat-raised-button color="primary">Search</button>

    <button mat-stroked-button>Reset</button>
  </div>

  <!-- Table starts here -->

  <div class="mat-elevation-z2">
    <table mat-table [dataSource]="cases" class="w-full">
      <!-- Case number -->
      <ng-container matColumnDef="caseNumber">
        <th mat-header-cell *matHeaderCellDef>Case No</th>
        <td mat-cell *matCellDef="let row">{{ row.caseNumber }}</td>
      </ng-container>
      <!-- Title -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let row">{{ row.title }}</td>
      </ng-container>
      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let row">{{ row.status }}</td>
      </ng-container>
      <!-- Header and rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <!-- Paginator -->
    <mat-paginator
      [length]="totalElements"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </div>
</div>
