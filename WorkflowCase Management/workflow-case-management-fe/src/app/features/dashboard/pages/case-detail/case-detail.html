<mat-card *ngIf="caseData">
  <h2>Case {{ caseData.caseNumber }}</h2>

  <p><strong>Title:</strong> {{ caseData.title }}</p>

  <p>
    <strong>Status:</strong>
    <mat-chip color="primary">
      {{ caseData.status }}
    </mat-chip>
  </p>
</mat-card>

<mat-divider></mat-divider>

<h3>Status History</h3>

<mat-list>
  <mat-list-item *ngFor="let h of history">
    <div>
      <strong>{{ h.oldStatus }} → {{ h.newStatus }}</strong>
      <br />
      by {{ h.changedBy }}
      <br />
      {{ h.createdAt | date: 'medium' }}
    </div>
  </mat-list-item>
</mat-list>
