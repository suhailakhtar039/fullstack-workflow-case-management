<h1 class="text-2xl font-semibold mb-6 flex justify-center">Inbox</h1>

<!-- Loading -->
<div *ngIf="isLoading" class="flex justify-center py-10">
  <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
</div>

<!-- Error -->
<div *ngIf="!isLoading && hasError" class="mb-4 p-3 rounded bg-red-100 text-red-700">
  {{ errorMessage }}
</div>

<!-- Empty state -->
<div *ngIf="!isLoading && !hasError && cases.length === 0" class="text-center text-gray-500 py-10">
  No pending cases.
</div>

<!-- Table -->
<div
  *ngIf="!isLoading && !hasError && cases.length > 0"
  class="mat-elevation-z2 rounded-lg overflow-hidden"
>
  <table mat-table [dataSource]="cases" class="w-full">
    <!-- Case Number -->
    <ng-container matColumnDef="caseNumber">
      <th mat-header-cell *matHeaderCellDef>Case No</th>
      <td mat-cell *matCellDef="let row">
        {{ row.caseNumber }}
      </td>
    </ng-container>

    <!-- Title -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let row">
        {{ row.title }}
      </td>
    </ng-container>

    <!-- Current Status -->
    <ng-container matColumnDef="currentStatus">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">
        {{ row.currentStatus }}
      </td>
    </ng-container>

    <!-- Pending Role -->
    <ng-container matColumnDef="pendingRole">
      <th mat-header-cell *matHeaderCellDef>Pending With</th>
      <td mat-cell *matCellDef="let row">
        {{ row.pendingRole }}
      </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let row">
        <button
          mat-stroked-button
          color="primary"
          [disabled]="actionInProgress === row.caseId"
          (click)="performAction(row)"
        >
          {{ row.targetStatus }}
        </button>
      </td>
    </ng-container>

    <!-- Header & Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover:bg-gray-50"></tr>
  </table>
</div>
